services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-day_agent}
      POSTGRES_USER: ${POSTGRES_USER:-day_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - day_planner_postgres_data:/var/lib/postgresql/data
      - ./app/db/schema.sql:/opt/day-planner/app/db/schema.sql:ro
      - ./app/db/migrations:/opt/day-planner/app/db/migrations:ro
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/01-day-planner-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - day-planner

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-day_agent}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-day_agent}
    command: ["/app/.venv/bin/python", "-m", "app.main"]
    volumes:
      - ./data:/app/data
    depends_on:
      database:
        condition: service_healthy
    networks:
      - day-planner

volumes:
  day_planner_postgres_data:

networks:
  day-planner:
